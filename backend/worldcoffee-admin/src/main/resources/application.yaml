spring:
  data:
    redis:
      host: localhost
      port: 6379
  web:
    resources:
      static-locations: file:./uploads/,classpath:/static/
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/worldCoffee?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      initialization-fail-timeout: -1
      minimum-idle: 2
  application:
    name: worldCoffee
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3     #最多重试3次
          initial-interval: 1s    #第一次重试间隔
          multiplier: 2   #每次间隔翻倍
          max-interval: 10s
        default-requeue-rejected: false #重试耗尽后不进队，直接变成死信  default-requeue-rejected: false 很重要，它让重试耗尽的消息不重新入队，而是走死信交换机。
  elasticsearch:
    uris: http://localhost:9200

  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: REDACTED_DASHSCOPE_KEY
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v3
          dimensions: 1024
    vectorstore:
      redis:
        initialize-schema: true
        index-name: coffee-knowledge
        prefix: "knowledge:"
    chat:
        memory:
          repository:
            jdbc:
              initialize-schema: always



jwt:
  secret: REDACTED_JWT_SECRET
  expire-time: 86400000

upload:
  path: D:\mycode\worldCoffee\worldCoffee\uploads

sms:
  # 验证码过期时间（秒）
  code-expire: 300
  # 发送间隔（秒），防止刷接口
  code-interval: 60


mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: cn.lx.worldcoffee.module.*.domain
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 雪花算法配置
snowflake:
  machine-id: 1
  data-center-id: 1

# 管理后台账号配置（单账号，无 RBAC）
# 密码明文存储，开发阶段够用；生产环境建议改为 BCrypt 哈希
admin:
  username: admin
  password: admin123




