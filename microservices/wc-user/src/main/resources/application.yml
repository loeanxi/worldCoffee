server:
  port: 8082

spring:
  application:
    name: wc-user
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
  datasource:
    url: jdbc:mysql://localhost:3306/worldCoffee?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# JWT配置（与网关保持一致）
jwt:
  secret: REDACTED_JWT_SECRET
  expire-time: 604800000  # 7天

# 文件上传路径
upload:
  path: D:\mycode\worldCoffee\worldCoffee\uploads

# SMS配置
sms:
  code-expire: 300  # 验证码过期时间（秒）
  code-interval: 60  # 发送间隔（秒）
